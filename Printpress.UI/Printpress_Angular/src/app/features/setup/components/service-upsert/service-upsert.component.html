<div class="rtl">
  <h2 mat-dialog-title>{{isEditMode ? 'تعديل خدمة' : 'إضافة خدمة جديدة'}}</h2>
  
  <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>اسم الخدمة</mat-label>
        <input matInput formControlName="name" required>
        <mat-error *ngIf="serviceForm.get('name')?.hasError('required')">
          اسم الخدمة مطلوب
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>السعر</mat-label>
        <input matInput type="number" formControlName="price" required min="0"/>
        <mat-error *ngIf="serviceForm.get('price')?.hasError('required')">
          السعر مطلوب
        </mat-error>
        <mat-error *ngIf="serviceForm.get('price')?.hasError('min')">
          السعر يجب أن يكون أكبر من أو يساوي صفر
        </mat-error>
      </mat-form-field>

      <app-search-select
        formControlName="serviceCategoryId"
        label="نوع الخدمة"
        [items]="serviceCategoryOptions"
        [required]="true"
        (selectionChange)="onCategorySelect($event)">
      </app-search-select>

      <!-- Inventory Items Dropdown (shown only when category requires inventory) -->
      <div *ngIf="requiresInventoryItem">
        <app-search-select
          [(ngModel)]="selectedInventoryItemId"
          [ngModelOptions]="{standalone: true}"
          label="عنصر المخزون"
          [items]="inventoryItemOptions"
          [disabled]="inventoryItemOptions.length === 0">
        </app-search-select>
      </div>
    </div>

    <div mat-dialog-actions class="justify-content-end">
      <button mat-button type="button" [mat-dialog-close]="false">إلغاء</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!serviceForm.valid">
        {{isEditMode ? 'تحديث' : 'إضافة'}}
      </button>
    </div>
  </form>
</div>
