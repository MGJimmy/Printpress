<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>miscellaneous_services</mat-icon>
    </div>
    <div>
      <h1>قائمة الخدمات</h1>
      <p>خدمات الطلبات والأسعار والتصنيف</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button type="button" (click)="openServiceDialog()">إضافة خدمة جديدة</button>
    </div>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>table_chart</mat-icon>
      <span>الخدمات</span>
    </div>
    <div class="table-wrap">
      <app-table-template
        [columnDefs]="columnDefs"
        [originalSource]="services"
        [isShowEditButton]="true"
        [isShowDeleteButton]="true"
        [showDeactivateButton]="true"
        (editClicked)="onEdit($event)"
        (deleteClicked)="onDelete($event)"
        (deactivateClicked)="onDeactivate($event)">
      </app-table-template>
    </div>
  </mat-card>
</div>
