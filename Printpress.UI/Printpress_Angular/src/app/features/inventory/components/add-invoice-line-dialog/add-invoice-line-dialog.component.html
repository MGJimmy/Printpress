<h2 mat-dialog-title>إضافة سطر فاتورة</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">

    <app-inventory-category-item-select
      [itemControl]="form.controls.inventoryItemId"
      [fullWidth]="true"
      (selectedItemChange)="onSelectedItem($event)">
    </app-inventory-category-item-select>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>الكمية</mat-label>
      <input matInput type="number" formControlName="quantity" min="0.01" />
      <mat-error *ngIf="form.controls.quantity.hasError('required')">يجب إدخال الكمية</mat-error>
      <mat-error *ngIf="form.controls.quantity.hasError('min')">يجب أن تكون الكمية أكبر من صفر</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>سعر الوحدة</mat-label>
      <input matInput type="number" formControlName="unitPrice" min="0.01" />
      <mat-error *ngIf="form.controls.unitPrice.hasError('required')">يجب إدخال سعر الوحدة</mat-error>
      <mat-error *ngIf="form.controls.unitPrice.hasError('min')">يجب أن يكون السعر أكبر من صفر</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">إلغاء</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid || !selectedItem" (click)="onConfirm()">إضافة</button>
</mat-dialog-actions>
