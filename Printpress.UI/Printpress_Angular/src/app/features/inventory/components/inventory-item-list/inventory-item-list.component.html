<div class="inv-items" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>warehouse</mat-icon>
    </div>
    <div>
      <h1>عناصر المخزون</h1>
      <p>الأصناف في المخزن، مع فواتير الإدخال وكل الحركات من هنا</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button type="button" (click)="onAdd()">
        <mat-icon>add</mat-icon>
        إضافة عنصر
      </button>
    </div>
  </header>

  <mat-card class="panel">
    <div class="toolbar">
      <button mat-stroked-button color="primary" (click)="onStockInClick()">
        <mat-icon>add</mat-icon>
        إدخال للمخزن
      </button>
      <button mat-stroked-button color="primary" (click)="onStockInInvoicesClick()">
        <mat-icon>receipt_long</mat-icon>
        فواتير الإدخال
      </button>
      <button mat-stroked-button color="warn" (click)="onStockOutClick()">
        <mat-icon>remove</mat-icon>
        صرف من المخزن
      </button>
      <button mat-stroked-button color="warn" (click)="onTransactionsClick()">
        <mat-icon>swap_vert</mat-icon>
        حركات المخزن
      </button>
    </div>
    <form [formGroup]="filterForm" class="filters">
      <mat-form-field appearance="outline">
        <mat-label>الفئة</mat-label>
        <mat-select formControlName="categoryId">
          <mat-option [value]="null">الكل</mat-option>
          <mat-option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>الاسم</mat-label>
        <mat-select formControlName="itemId" [disabled]="!filterForm.controls.categoryId.value">
          <mat-option value="">الكل</mat-option>
          <mat-option *ngFor="let item of nameItems" [value]="item.id">{{ item.name }}</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
    <div class="table-wrap">
      <app-table-template
        [columnDefs]="columnDefs"
        [originalSource]="items"
        [totalItemsCount]="totalCount"
        [isShowEditButton]="true"
        [isShowDeleteButton]="true"
        [showViewButton]="true"
        [showDeactivateButton]="true"
        (editClicked)="onEdit($event)"
        (deleteClicked)="onDelete($event)"
        (viewClicked)="onView($event)"
        (deactivateClicked)="onDeactivate($event)"
        (activateClicked)="onActivate($event)"
        (pageChanged)="onPageChange($event)">
      </app-table-template>
    </div>
  </mat-card>
</div>
