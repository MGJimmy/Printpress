<div class="container mt-4" dir="rtl">

  <!-- Item Details Card -->
  <mat-card>
    <mat-card-header>
      <div class="w-100 d-flex justify-content-between align-items-center">
        <mat-card-title>تفاصيل الصنف</mat-card-title>
        <button mat-button (click)="onBack()">
          <mat-icon>arrow_back</mat-icon>
          رجوع
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" class="mt-3">
        <div class="row">

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>اسم الصنف</mat-label>
              <input matInput formControlName="name" />
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>الفئة</mat-label>
              <input matInput formControlName="inventoryItemCategory" />
            </mat-form-field>
          </div>

          <div class="col-md-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>عبوات / كرتونة</mat-label>
              <input matInput formControlName="packsPerCarton" />
            </mat-form-field>
          </div>

          <div class="col-md-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>وحدات / عبوة</mat-label>
              <input matInput formControlName="unitsPerPack" />
            </mat-form-field>
          </div>

          <div class="col-md-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>نسبة الفاقد الشراء %</mat-label>
              <input matInput formControlName="expectedPurchaseLossPercent" />
            </mat-form-field>
          </div>

          <div class="col-md-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>نسبة الهالك الإنتاج %</mat-label>
              <input matInput formControlName="expectedProductionWastePercent" />
            </mat-form-field>
          </div>
          
          <div class="col-md-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>الكمية في المخزون</mat-label>
              <input matInput formControlName="stockQuantity" />
            </mat-form-field>
          </div>

        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Filter Card -->
  <mat-card class="mt-4">
    <mat-card-header>
      <mat-card-title>تصفية الحركات</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="row mt-3 align-items-end g-3">
        <div class="col-md-3">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>من تاريخ</mat-label>
            <input matInput [matDatepicker]="pickerFrom" [(ngModel)]="filterDateFrom">
            <mat-datepicker-toggle matSuffix [for]="pickerFrom"></mat-datepicker-toggle>
            <mat-datepicker #pickerFrom></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="col-md-3">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>إلى تاريخ</mat-label>
            <input matInput [matDatepicker]="pickerTo" [(ngModel)]="filterDateTo">
            <mat-datepicker-toggle matSuffix [for]="pickerTo"></mat-datepicker-toggle>
            <mat-datepicker #pickerTo></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="col-md-3">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>نوع الحركة</mat-label>
            <mat-select [(ngModel)]="filterTransactionType">
              <mat-option value="">الكل</mat-option>
              <mat-option value="In">إدخال</mat-option>
              <mat-option value="Out">صرف</mat-option>
              <mat-option value="Adjustment">تسوية</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button mat-raised-button color="primary" (click)="applyFilter()">بحث</button>
          <button mat-stroked-button (click)="resetFilter()">إعادة تعيين</button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Transactions Card -->
  <mat-card class="mt-4">
    <mat-card-header>
      <mat-card-title>حركات المخزون</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="mt-3">
        <app-table-template
          [columnDefs]="columnDefs"
          [originalSource]="transactions"
          [totalItemsCount]="totalTransactionsCount"
          [isShowEditButton]="false"
          [isShowDeleteButton]="false"
          [linkColumnName]="'workerName'"
          (linkColumnClicked)="onWorkerLinkClicked($event)"
          (pageChanged)="onPageChanged($event)">
        </app-table-template>

        <p *ngIf="transactions.length === 0" class="text-muted text-center mt-2">
          لا توجد حركات مخزون لهذا الصنف.
        </p>
      </div>
    </mat-card-content>
  </mat-card>

</div>
