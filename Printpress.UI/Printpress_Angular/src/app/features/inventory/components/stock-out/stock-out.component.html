<div class="container mt-4" dir="rtl">
  <mat-card>
    <mat-card-header>
      <mat-card-title>صرف من المخزن</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" class="mt-3">

        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>الصنف</mat-label>
              <mat-select formControlName="inventoryItemId">
                <mat-option *ngFor="let item of inventoryItems" [value]="item.id">
                  {{ item.name }}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="form.controls.inventoryItemId.hasError('required')">يجب اختيار الصنف</mat-error>
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <app-search-select
              formControlName="workerId"
              [items]="workerItems"
              label="العامل (اختياري)"
              [required]="false">
            </app-search-select>
          </div>
        </div>

        <div class="row align-items-center">
          <div class="col-md-4">
            <mat-form-field appearance="outline" class="full-width"
              [class.quantity-exceeded]="form.controls.quantity.hasError('maxStock')">
              <mat-label>الكمية</mat-label>
              <input matInput type="number" formControlName="quantity" min="1" />
              <mat-error *ngIf="form.controls.quantity.hasError('required')">يجب إدخال الكمية</mat-error>
              <mat-error *ngIf="form.controls.quantity.hasError('min')">يجب أن تكون الكمية أكبر من صفر</mat-error>
              <mat-error *ngIf="form.controls.quantity.hasError('maxStock')">الكمية تتجاوز المتاح في المخزون</mat-error>
            </mat-form-field>
          </div>
          <div class="col-md-4 mb-3" *ngIf="selectedItem">
            <span [class.text-success]="remaining >= 0" [class.text-danger]="remaining < 0">
              المتبقي بعد الصرف: {{ remaining }} وحدة
            </span>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>ملاحظات (اختياري)</mat-label>
              <textarea matInput formControlName="notes" rows="3"></textarea>
            </mat-form-field>
          </div>
        </div>

      </form>
    </mat-card-content>

    <mat-card-actions align="end" class="mt-2 me-2 mb-2">
      <button mat-button (click)="onCancel()">إلغاء</button>
      <button mat-raised-button color="warn"
              [disabled]="form.invalid"
              (click)="onSave()">
        صرف
      </button>
    </mat-card-actions>

  </mat-card>
</div>

<style>
  .full-width { width: 100%; }
  .quantity-exceeded .mat-mdc-form-field-flex { border-color: #f44336 !important; }
</style>
