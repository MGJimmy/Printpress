<div class="container mt-4" dir="rtl">
  <mat-card>
    <mat-card-header>
      <div class="w-100 d-flex justify-content-between align-items-center">
        <mat-card-title>{{ isEditMode ? 'تعديل قطعة غيار' : 'إضافة قطعة غيار جديدة' }}</mat-card-title>
        <button mat-button (click)="onCancel()">
          <mat-icon>arrow_back</mat-icon>
          رجوع
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="isLimited" class="limited-warning mt-3 mb-2 p-3">
        <mat-icon class="warning-icon">warning</mat-icon>
        <span>محدود — بعض الحقول لا يمكن تعديلها لوجود حركات مخزون مرتبطة بهذه القطعة</span>
      </div>

      <form [formGroup]="form" class="mt-3">
        <div class="row">

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>اسم القطعة</mat-label>
              <input matInput formControlName="name" />
              <mat-error *ngIf="form.controls.name.hasError('required')">يجب إدخال اسم القطعة</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-3">
            <mat-form-field appearance="outline" class="full-width" [class.limited-field]="isLimited">
              <mat-label>
                عبوات / كرتونة
                <span *ngIf="isLimited" class="limited-badge">محدود</span>
              </mat-label>
              <input matInput type="number" formControlName="packsPerCarton" min="0" />
            </mat-form-field>
          </div>

          <div class="col-md-3">
            <mat-form-field appearance="outline" class="full-width" [class.limited-field]="isLimited">
              <mat-label>
                وحدات / عبوة
                <span *ngIf="isLimited" class="limited-badge">محدود</span>
              </mat-label>
              <input matInput type="number" formControlName="unitsPerPack" min="0" />
            </mat-form-field>
          </div>

        </div>
      </form>
    </mat-card-content>

    <mat-card-actions align="end" class="mt-2 me-2 mb-2">
      <button mat-button (click)="onCancel()">إلغاء</button>
      <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="onSave()">
        {{ isEditMode ? 'تعديل' : 'إضافة' }}
      </button>
    </mat-card-actions>

  </mat-card>
</div>
<style>
  .full-width { width: 100%; }
  .limited-warning { background: #fff3e0; border-left: 4px solid #ff9800; display: flex; align-items: center; gap: 8px; }
  .limited-badge { font-size: 10px; background: #ff9800; color: white; padding: 2px 4px; border-radius: 4px; }
</style>
