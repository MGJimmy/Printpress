<h2 mat-dialog-title>إضافة سطر</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>القطعة</mat-label>
      <mat-select formControlName="sparePartItemId">
        <mat-option *ngFor="let item of data.items" [value]="item.id">
          {{ item.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.controls.sparePartItemId.hasError('required')">يجب اختيار القطعة</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>الكمية</mat-label>
      <input matInput type="number" formControlName="quantity" min="0.01" />
      <mat-error *ngIf="form.controls.quantity.hasError('required')">يجب إدخال الكمية</mat-error>
      <mat-error *ngIf="form.controls.quantity.hasError('min')">يجب أن تكون الكمية أكبر من صفر</mat-error>
      <mat-error *ngIf="form.controls.quantity.hasError('stockExceeded')">
        الكمية المطلوبة أكبر من المتاح في المخزون (المتاح: {{ getSelectedItemStock() }})
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>سعر الوحدة</mat-label>
      <input matInput type="number" formControlName="unitPrice" min="0.01" />
      <mat-error *ngIf="form.controls.unitPrice.hasError('required')">يجب إدخال سعر الوحدة</mat-error>
      <mat-error *ngIf="form.controls.unitPrice.hasError('min')">يجب أن يكون السعر أكبر من صفر</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">إلغاء</button>
  <button mat-raised-button color="primary" (click)="onConfirm()">إضافة</button>
</mat-dialog-actions>

<style>
  .full-width { width: 100%; }
  .dialog-form { display: flex; flex-direction: column; gap: 8px; min-width: 350px; }
</style>
