<div class="sp-items" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>build</mat-icon>
    </div>
    <div>
      <h1>قطع الغيار</h1>
      <p>الأصناف في المخزن، مع إدخال وصرف الفواتير من هنا</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button type="button" (click)="onAdd()">
        <mat-icon>add</mat-icon>
        إضافة قطعة
      </button>
    </div>
  </header>

  <mat-card class="panel">
    <div class="toolbar">
      <button mat-stroked-button color="primary" (click)="onStockInClick()">
        <mat-icon>add</mat-icon>
        إدخال للمخزن
      </button>
      <button mat-stroked-button color="primary" (click)="onStockInInvoicesClick()">
        <mat-icon>receipt_long</mat-icon>
        فواتير الإدخال
      </button>
      <button mat-stroked-button color="warn" (click)="onStockOutClick()">
        <mat-icon>remove</mat-icon>
        فاتورة بيع / صرف
      </button>
      <button mat-stroked-button color="warn" (click)="onStockOutInvoicesClick()">
        <mat-icon>receipt_long</mat-icon>
        فواتير الصرف
      </button>
    </div>
    <div class="table-wrap">
      <app-table-template
        [columnDefs]="columnDefs"
        [originalSource]="items"
        [totalItemsCount]="totalCount"
        [isShowEditButton]="true"
        [isShowDeleteButton]="true"
        [showViewButton]="true"
        (editClicked)="onEdit($event)"
        (deleteClicked)="onDelete($event)"
        (viewClicked)="onView($event)"
        (pageChanged)="onPageChange($event)">
      </app-table-template>
    </div>
  </mat-card>
</div>
