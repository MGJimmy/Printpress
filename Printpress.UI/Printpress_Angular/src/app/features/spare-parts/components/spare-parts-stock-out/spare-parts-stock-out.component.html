<div class="container mt-4" dir="rtl">
  <mat-card>
    <mat-card-header>
      <mat-card-title>فاتورة بيع قطع الغيار (صرف من المخزن)</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" class="mt-3">
        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>اسم العميل</mat-label>
              <input matInput formControlName="clientName" />
              <mat-error *ngIf="form.controls.clientName.hasError('required')">يجب إدخال اسم العميل</mat-error>
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>تاريخ الفاتورة</mat-label>
              <input matInput [matDatepicker]="picker" formControlName="invoiceDate" />
              <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
              <mat-error *ngIf="form.controls.invoiceDate.hasError('required')">يجب إدخال تاريخ الفاتورة</mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>

      <div class="mt-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">أسطر الفاتورة</h5>
          <button mat-raised-button color="accent" (click)="onAddLine()">
            <mat-icon>add</mat-icon>
            إضافة سطر
          </button>
        </div>

        <app-table-template
          [columnDefs]="columnDefs"
          [originalSource]="lines"
          [totalItemsCount]="lines.length"
          [isShowDeleteButton]="true"
          [isShowEditButton]="false"
          (deleteClicked)="onDeleteLine($event)">
        </app-table-template>

        <p *ngIf="lines.length === 0" class="text-muted text-center mt-2">
          لا توجد أسطر مضافة. اضغط "إضافة سطر" لإضافة قطعة.
        </p>

        <div *ngIf="lines.length > 0" class="mt-3 text-end">
          <strong>الإجمالي: {{ totalAmount | number:'1.2-2' }}</strong>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions align="end" class="mt-3 me-2 mb-2">
      <button mat-button (click)="onCancel()">إلغاء</button>
      <button mat-raised-button color="warn"
              [disabled]="form.invalid || lines.length === 0"
              (click)="onSave()">
        حفظ فاتورة البيع
      </button>
    </mat-card-actions>
  </mat-card>
</div>
<style>.full-width { width: 100%; }</style>
