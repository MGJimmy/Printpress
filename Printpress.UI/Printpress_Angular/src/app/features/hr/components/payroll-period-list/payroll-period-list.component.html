<div class="container mt-4" dir="rtl">
  <mat-card>
    <mat-card-header>
      <div class="w-100 d-flex justify-content-between align-items-center">
        <mat-card-title>دورات الرواتب</mat-card-title>
        <button mat-raised-button color="primary" (click)="onAdd()">
          <mat-icon>add</mat-icon>
          إضافة دورة رواتب
        </button>
      </div>
    </mat-card-header>

    <mat-card-content class="mt-3">
      <table mat-table [dataSource]="periods" class="mat-elevation-z1 w-100">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>اسم الدورة</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>

        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef>تاريخ البداية</th>
          <td mat-cell *matCellDef="let row">{{ row.startDate | date:'yyyy-MM-dd' }}</td>
        </ng-container>

        <ng-container matColumnDef="endDate">
          <th mat-header-cell *matHeaderCellDef>تاريخ النهاية</th>
          <td mat-cell *matCellDef="let row">{{ row.endDate | date:'yyyy-MM-dd' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>الحالة</th>
          <td mat-cell *matCellDef="let row">
            <span [class]="row.isClosed ? 'badge-closed' : 'badge-open'">
              {{ row.isClosed ? 'مغلقة' : 'مفتوحة' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>الإجراءات</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" (click)="onViewDetails(row.id)" title="عرض التفاصيل">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
      </table>

      <div *ngIf="periods.length === 0" class="text-center text-muted mt-4">
        لا توجد دورات رواتب
      </div>
    </mat-card-content>
  </mat-card>
</div>

<style>
  table { direction: rtl; }
  th.mat-header-cell, td.mat-cell { padding: 8px 12px !important; }
  .badge-open { background: #e8f5e9; color: #2e7d32; padding: 3px 10px; border-radius: 12px; font-size: 13px; }
  .badge-closed { background: #fce4ec; color: #c62828; padding: 3px 10px; border-radius: 12px; font-size: 13px; }
</style>
