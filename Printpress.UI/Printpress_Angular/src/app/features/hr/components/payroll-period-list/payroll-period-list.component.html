<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>payments</mat-icon>
    </div>
    <div>
      <h1>دورات الرواتب</h1>
      <p>فترات صرف الرواتب وإغلاق الدورة</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button type="button" (click)="onAdd()">
        <mat-icon>add</mat-icon>
        إضافة دورة رواتب
      </button>
    </div>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>table_chart</mat-icon>
      <span>الدورات</span>
      <span class="count">{{ periodsTotalCount }}</span>
    </div>
    <div class="table-wrap" *ngIf="rows.length > 0; else noData">
      <app-table-template
        [originalSource]="rows"
        [columnDefs]="colDefs"
        [totalItemsCount]="periodsTotalCount"
        [showViewButton]="true"
        [isShowEditButton]="false"
        [isShowDeleteButton]="false"
        (viewClicked)="onViewDetails($event)"
        (pageChanged)="onPageChange($event)">
      </app-table-template>
    </div>
    <ng-template #noData>
      <p class="empty">لا توجد دورات رواتب</p>
    </ng-template>
  </mat-card>
</div>
