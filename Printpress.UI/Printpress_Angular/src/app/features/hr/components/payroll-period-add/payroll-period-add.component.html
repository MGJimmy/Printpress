<div class="container mt-4" dir="rtl">
  <mat-card>
    <mat-card-header>
      <mat-card-title>إضافة دورة رواتب</mat-card-title>
    </mat-card-header>

    <mat-card-content class="mt-3">
      <form [formGroup]="form">
        <div class="row g-3">

          <div class="col-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>اسم الدورة</mat-label>
              <input matInput formControlName="name" placeholder="مثال: يناير 2025" />
              <mat-error>اسم الدورة مطلوب</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>تاريخ البداية</mat-label>
              <input matInput [matDatepicker]="pickerStart" formControlName="startDate" />
              <mat-datepicker-toggle matIconSuffix [for]="pickerStart"></mat-datepicker-toggle>
              <mat-datepicker #pickerStart></mat-datepicker>
              <mat-error>تاريخ البداية مطلوب</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>تاريخ النهاية</mat-label>
              <input matInput [matDatepicker]="pickerEnd" formControlName="endDate" />
              <mat-datepicker-toggle matIconSuffix [for]="pickerEnd"></mat-datepicker-toggle>
              <mat-datepicker #pickerEnd></mat-datepicker>
              <mat-error>تاريخ النهاية مطلوب</mat-error>
            </mat-form-field>
          </div>

        </div>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button (click)="onCancel()">إلغاء</button>
      <button mat-raised-button color="primary" (click)="onSave()">حفظ</button>
    </mat-card-actions>
  </mat-card>
</div>
