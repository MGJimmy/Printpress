<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>event</mat-icon>
    </div>
    <div>
      <h1>إضافة دورة رواتب</h1>
      <p>اسم الدورة وتاريخ البداية والنهاية</p>
    </div>
    <button mat-stroked-button type="button" class="hero-back" (click)="onCancel()">
      <mat-icon>arrow_back</mat-icon>
      رجوع
    </button>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>edit_note</mat-icon>
      <span>بيانات الدورة</span>
    </div>
    <form [formGroup]="form">
      <div class="filters">
        <mat-form-field appearance="outline">
          <mat-label>اسم الدورة</mat-label>
          <input matInput formControlName="name" placeholder="مثال: يناير 2025" />
          <mat-error>اسم الدورة مطلوب</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>تاريخ البداية</mat-label>
          <input matInput [matDatepicker]="pickerStart" formControlName="startDate" />
          <mat-datepicker-toggle matIconSuffix [for]="pickerStart"></mat-datepicker-toggle>
          <mat-datepicker #pickerStart></mat-datepicker>
          <mat-error>تاريخ البداية مطلوب</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>تاريخ النهاية</mat-label>
          <input matInput [matDatepicker]="pickerEnd" formControlName="endDate" />
          <mat-datepicker-toggle matIconSuffix [for]="pickerEnd"></mat-datepicker-toggle>
          <mat-datepicker #pickerEnd></mat-datepicker>
          <mat-error>تاريخ النهاية مطلوب</mat-error>
        </mat-form-field>
      </div>
      <div class="actions">
        <button mat-raised-button color="primary" type="button" (click)="onSave()">حفظ</button>
        <button mat-stroked-button type="button" (click)="onCancel()">إلغاء</button>
      </div>
    </form>
  </mat-card>
</div>
