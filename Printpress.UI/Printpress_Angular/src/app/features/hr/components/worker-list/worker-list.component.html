<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>badge</mat-icon>
    </div>
    <div>
      <h1>قائمة العمال</h1>
      <p>بيانات العمال وحالة النشاط ونوع الراتب</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button type="button" (click)="onAdd()">
        <mat-icon>add</mat-icon>
        إضافة عامل
      </button>
    </div>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>table_chart</mat-icon>
      <span>العمال</span>
      <span class="count">{{ workersTotalCount }}</span>
    </div>
    <div class="table-wrap">
      <app-table-template
        [columnDefs]="columnDefs"
        [originalSource]="workers"
        [totalItemsCount]="workersTotalCount"
        [isShowEditButton]="true"
        [isShowDeleteButton]="false"
        [showViewButton]="true"
        [showDeactivateButton]="true"
        (editClicked)="onEdit($event)"
        (viewClicked)="onView($event)"
        (deactivateClicked)="onDeactivate($event)"
        (activateClicked)="onActivate($event)"
        (pageChanged)="onPageChange($event)">
      </app-table-template>
    </div>
  </mat-card>
</div>
