<div class="container mt-4" dir="rtl">
  <mat-card>
    <mat-card-header>
      <div class="w-100 d-flex justify-content-between align-items-center">
        <mat-card-title>قائمة العمال</mat-card-title>
        <button mat-raised-button color="primary" (click)="onAdd()">
          <mat-icon>add</mat-icon>
          إضافة عامل
        </button>
      </div>
    </mat-card-header>

    <mat-card-content class="mt-3">
      <app-table-template
        [columnDefs]="columnDefs"
        [originalSource]="workers"
        [totalItemsCount]="workers.length"
        [isShowEditButton]="true"
        [isShowDeleteButton]="false"
        [showViewButton]="true"
        [showDeactivateButton]="true"
        (editClicked)="onEdit($event)"
        (viewClicked)="onView($event)"
        (deactivateClicked)="onDeactivate($event)">
      </app-table-template>
    </mat-card-content>
  </mat-card>
</div>
