<div class="container mt-4" dir="rtl">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'تعديل بيانات العامل' : 'إضافة عامل جديد' }}</mat-card-title>
    </mat-card-header>

    <mat-card-content class="mt-3">
      <form [formGroup]="form">
        <div class="row g-3">

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>الاسم</mat-label>
              <input matInput formControlName="name" />
              <mat-error>الاسم مطلوب</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>رقم الهاتف</mat-label>
              <input matInput formControlName="phoneNumber" />
            </mat-form-field>
          </div>

          <div class="col-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>العنوان</mat-label>
              <input matInput formControlName="address" />
            </mat-form-field>
          </div>

          <div class="col-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>ملاحظات</mat-label>
              <textarea matInput formControlName="notes" rows="3"></textarea>
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>نوع الراتب</mat-label>
              <mat-select formControlName="salaryType">
                <mat-option [value]="1">شهري</mat-option>
                <mat-option [value]="2">يومي</mat-option>
              </mat-select>
              <mat-error>نوع الراتب مطلوب</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-6" *ngIf="showMonthlySalary">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>الراتب الشهري</mat-label>
              <input matInput type="number" formControlName="monthlySalary" />
            </mat-form-field>
          </div>

          <div class="col-md-6" *ngIf="showDailySalary">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>الراتب اليومي</mat-label>
              <input matInput type="number" formControlName="dailySalary" />
            </mat-form-field>
          </div>

        </div>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button (click)="onCancel()">إلغاء</button>
      <button mat-raised-button color="primary" (click)="onSave()">حفظ</button>
    </mat-card-actions>
  </mat-card>
</div>
