<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>person</mat-icon>
    </div>
    <div class="hero-text">
      <h1>{{ isEditMode ? 'تعديل بيانات العامل' : 'إضافة عامل جديد' }}</h1>
      <p>الاسم وبيانات الراتب</p>
    </div>
    <button mat-stroked-button type="button" class="hero-back" (click)="onCancel()">
      <mat-icon>arrow_back</mat-icon>
      رجوع
    </button>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>edit_note</mat-icon>
      <span>بيانات العامل</span>
    </div>
    <form [formGroup]="form">
      <div class="filters">
        <mat-form-field appearance="outline">
          <mat-label>الاسم *</mat-label>
          <input matInput formControlName="name" required />
          <mat-error *ngIf="form.controls.name.hasError('required')">الاسم مطلوب</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>رقم الهاتف</mat-label>
          <input matInput formControlName="phoneNumber" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>العنوان</mat-label>
          <input matInput formControlName="address" />
        </mat-form-field>

        <app-search-select
          formControlName="salaryType"
          label="نوع الراتب *"
          [items]="salaryTypeOptions"
          [required]="true">
        </app-search-select>

        <mat-form-field appearance="outline" *ngIf="showMonthlySalary">
          <mat-label>الراتب الشهري</mat-label>
          <input matInput type="number" formControlName="monthlySalary" />
        </mat-form-field>

        <mat-form-field appearance="outline" *ngIf="showDailySalary">
          <mat-label>الراتب اليومي</mat-label>
          <input matInput type="number" formControlName="dailySalary" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="notes-span">
          <mat-label>ملاحظات</mat-label>
          <textarea matInput formControlName="notes" rows="2"></textarea>
        </mat-form-field>
      </div>
      <div class="actions">
        <button mat-raised-button color="primary" type="button" (click)="onSave()">حفظ</button>
        <button mat-stroked-button type="button" (click)="onCancel()">إلغاء</button>
      </div>
    </form>
  </mat-card>
</div>
