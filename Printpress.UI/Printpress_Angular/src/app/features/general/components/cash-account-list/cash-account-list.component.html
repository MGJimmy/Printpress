<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>account_balance_wallet</mat-icon>
    </div>
    <div>
      <h1>الخزينة</h1>
      <p>حسابات النقدية والتحويل بينها</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button type="button" (click)="onTransfer()">تحويل بين الخزائن</button>
    </div>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>table_chart</mat-icon>
      <span>الحسابات</span>
      <span class="count">{{ totalCount }}</span>
    </div>
    <div class="table-wrap">
      <app-table-template
        [columnDefs]="columnDefs"
        [originalSource]="accounts"
        [totalItemsCount]="totalCount"
        [isShowEditButton]="false"
        [isShowDeleteButton]="false"
        [showViewButton]="true"
        [linkColumnName]="'name'"
        (linkColumnClicked)="onNameClicked($event)"
        (viewClicked)="onView($event)">
      </app-table-template>
    </div>
  </mat-card>
</div>
