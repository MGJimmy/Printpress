<h2 mat-dialog-title>إضافة حركة مالية</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="mt-2">
    <div class="row g-3">

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>نوع الحركة</mat-label>
          <mat-select formControlName="type">
            <mat-option *ngFor="let t of transactionTypeOptions" [value]="t.value">{{ t.label }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls.type.hasError('required')">نوع الحركة مطلوب</mat-error>
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>الفئة</mat-label>
          <mat-select formControlName="category" [disabled]="!form.controls.type.value">
            <mat-option *ngFor="let c of filteredCategories" [value]="c.value">{{ c.label }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls.category.hasError('required')">الفئة مطلوبة</mat-error>
        </mat-form-field>
      </div>

      <div class="col-md-6" *ngIf="showOrderSelector">
        <app-search-select
          formControlName="orderId"
          [items]="externalOrderItems"
          label="الطلب (تنفيذ خارجي)"
          [required]="true">
        </app-search-select>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>المبلغ</mat-label>
          <input matInput type="number" formControlName="amount" min="0.01" />
          <mat-error *ngIf="form.controls.amount.hasError('required')">المبلغ مطلوب</mat-error>
          <mat-error *ngIf="form.controls.amount.hasError('min')">يجب أن يكون المبلغ أكبر من صفر</mat-error>
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>التاريخ</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="transactionDate" />
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error *ngIf="form.controls.transactionDate.hasError('required')">التاريخ مطلوب</mat-error>
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>الوصف</mat-label>
          <input matInput formControlName="description" />
        </mat-form-field>
      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">إلغاء</button>
  <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="isSubmitting">حفظ</button>
</mat-dialog-actions>
