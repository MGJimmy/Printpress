<mat-card class="p-4">
  <mat-card-title class="text-center">خدمات المجموعة</mat-card-title>
  <mat-card-content>
    <div class="row mb-3">
      <div class="col-12">
        <label class="form-label fw-bold">نوع التنفيذ:</label>
        <mat-radio-group [(ngModel)]="executionType" (change)="onExecutionTypeChange($event.value)" class="d-flex gap-4 mt-1">
          <mat-radio-button *ngFor="let t of executionTypes" [value]="t">
            {{ executionTypeLabels[t] }}
          </mat-radio-button>
        </mat-radio-group>
      </div>
    </div>
    <div class="row my-3">
      <!-- Categories Dropdown -->
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>الفئة</mat-label>
          <mat-select [(ngModel)]="selectedCategory" (selectionChange)="onCategorySelect($event.value)">
            <mat-option *ngFor="let cat of serviceCategories" [value]="cat">{{ cat |serviceCategoryArabic }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Services Dropdown -->
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>الخدمة</mat-label>
          <mat-select [(ngModel)]="selectedServiceId" [disabled]="!filteredServices ||filteredServices.length === 0">
            <mat-option *ngFor="let service of filteredServices" [value]="service.id">
              {{ service.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <div class="row my-3">
      <!-- Add Button -->
      <div class="col-md-12 text-center">
        <button mat-raised-button color="primary" (click)="addGroupService()">إضافة</button>
      </div>
    </div>
  </mat-card-content>
  <div></div>
  <app-table-template style="width: 95%;" class="mx-auto mt-3" *ngIf="tableData" [isShowDeleteButton]="true"
    [columnDefs]="columnDefs" [originalSource]="tableData" (deleteClicked)="onDeleteServiceCat($event)">
  </app-table-template>

  <hr>
  <div class="d-flex justify-content-center gap-3">
    <button mat-raised-button color="accent" class="px-5 mb-3" (click)="onClickSave()">حفظ</button>
    <button mat-stroked-button class="px-5 mb-3" (click)="onCancel()">إلغاء</button>
  </div>
</mat-card>
