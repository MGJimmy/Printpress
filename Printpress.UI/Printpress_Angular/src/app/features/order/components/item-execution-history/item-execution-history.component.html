<div class="page-shell" dir="rtl" *ngIf="history; else loadingTemplate">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>history</mat-icon>
    </div>
    <div>
      <h1>{{ history.itemName }}</h1>
      <p>{{ history.groupName }}</p>
    </div>
    <button mat-stroked-button type="button" class="hero-back" (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
      رجوع
    </button>
  </header>

  <section class="kpis">
    <article class="kpi kpi-qty">
      <span class="kpi-label">الكمية</span>
      <strong>{{ history.quantity }}</strong>
    </article>
    <article class="kpi kpi-stock">
      <span class="kpi-label">الحالة</span>
      <strong>{{ itemStatusLabel(history.status) }}</strong>
    </article>
  </section>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>table_chart</mat-icon>
      <span>تقدم الخدمات</span>
    </div>
    <div class="table-wrap">
      <app-table-template
        [originalSource]="flatProgress"
        [columnDefs]="progressColDefs"
        [totalItemsCount]="flatProgress.length"
        [isShowEditButton]="false"
        [isShowDeleteButton]="false"
        [showViewButton]="false">
      </app-table-template>
    </div>
  </mat-card>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>receipt_long</mat-icon>
      <span>سجل التنفيذ</span>
      <span class="count">{{ history.executionRecords.length }}</span>
    </div>
    <div class="table-wrap" *ngIf="flatRecords.length > 0; else noRecords">
      <app-table-template
        [originalSource]="flatRecords"
        [columnDefs]="recordColDefs"
        [totalItemsCount]="flatRecords.length"
        [isShowEditButton]="false"
        [isShowDeleteButton]="false"
        [showViewButton]="false">
      </app-table-template>
    </div>
    <ng-template #noRecords>
      <p class="empty">لا توجد سجلات تنفيذ بعد</p>
    </ng-template>
  </mat-card>
</div>

<ng-template #loadingTemplate>
  <div class="page-shell empty" dir="rtl">جاري التحميل...</div>
</ng-template>
