<div class="container mt-4 mb-5 rtl" *ngIf="history; else loadingTemplate">

  <!-- Page Header -->
  <div class="page-header mb-4">
    <h2 class="text-center text-primary border-bottom pb-3">{{ history.itemName }}</h2>
  </div>

  <mat-card class="shadow-sm mb-3">
    <mat-card-content>

      <!-- Toolbar -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <div>
            <span class="text-muted">المجموعة: </span>
            <strong>{{ history.groupName }}</strong>
          </div>
          <div>
            <span class="text-muted">الكمية: </span>
            <strong>{{ history.quantity }}</strong>
          </div>
          <div>
            <span class="text-muted">الحالة: </span>
            <span class="badge" [ngClass]="getStatusBadgeClass(history.status)">
              {{ itemStatusLabels[history.status] || history.status }}
            </span>
          </div>
        </div>
        <button mat-raised-button color="primary" (click)="onBack()">
          <mat-icon>arrow_back</mat-icon>
          رجوع
        </button>
      </div>

      <!-- Service Progress Table -->
      <h6 class="text-muted mb-2">تقدم الخدمات</h6>
      <app-table-template
        [originalSource]="flatProgress"
        [columnDefs]="progressColDefs"
        [totalItemsCount]="flatProgress.length"
        [isShowEditButton]="false"
        [isShowDeleteButton]="false"
        [showViewButton]="false">
      </app-table-template>

    </mat-card-content>
  </mat-card>

  <!-- Execution Records Table -->
  <mat-card class="shadow-sm">
    <mat-card-content>
      <h6 class="text-muted mb-2">
        سجل التنفيذ
        <span class="badge bg-secondary ms-2">{{ history.executionRecords.length }}</span>
      </h6>

      <div *ngIf="flatRecords.length > 0; else noRecords">
        <app-table-template
          [originalSource]="flatRecords"
          [columnDefs]="recordColDefs"
          [totalItemsCount]="flatRecords.length"
          [isShowEditButton]="false"
          [isShowDeleteButton]="false"
          [showViewButton]="false">
        </app-table-template>
      </div>

      <ng-template #noRecords>
        <div class="text-center my-4 text-muted">لا توجد سجلات تنفيذ بعد</div>
      </ng-template>
    </mat-card-content>
  </mat-card>

</div>

<ng-template #loadingTemplate>
  <div class="container mt-4 text-center text-muted rtl">جاري التحميل...</div>
</ng-template>
