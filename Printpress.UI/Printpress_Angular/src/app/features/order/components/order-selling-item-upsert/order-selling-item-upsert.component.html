<div class="rtl">
    <h2 mat-dialog-title>{{ isEdit ? 'تعديل عنصر بيع' : 'إضافة عنصر بيع' }}</h2>

    <mat-dialog-content>
        <form [formGroup]="form" class="row g-3 mt-1">

            <!-- Radio Buttons -->
            <div class="col-12">
                <mat-radio-group formControlName="isInventoryItem" (change)="onRadioChange()" class="d-flex gap-4">
                    <mat-radio-button [value]="false">بيع عنصر خارجي</mat-radio-button>
                    <mat-radio-button [value]="true">بيع عنصر من المخزن</mat-radio-button>
                </mat-radio-group>
            </div>

            <!-- External item name -->
            <div class="col-md-6" *ngIf="!isInventoryItem">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>اسم العنصر</mat-label>
                    <input matInput formControlName="name">
                    <mat-error *ngIf="form.get('name')?.errors?.['required']">الاسم مطلوب</mat-error>
                </mat-form-field>
            </div>

            <!-- Inventory item DDL -->
            <div class="col-md-6" *ngIf="isInventoryItem">
                <app-search-select
                    formControlName="inventoryItemId"
                    label="اختر عنصر من المخزن"
                    [items]="inventoryItemOptions"
                    [required]="true"
                    (selectionChange)="onInventoryItemSelect()">
                </app-search-select>
            </div>

            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>تفاصيل</mat-label>
                    <textarea matInput formControlName="details" rows="3"></textarea>
                </mat-form-field>
            </div>

            <!-- Quantity -->
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>الكمية</mat-label>
                    <input matInput type="number" formControlName="quantity" min="0" step="any">
                    <mat-error *ngIf="form.get('quantity')?.errors?.['required']">الكمية مطلوبة</mat-error>
                    <mat-error *ngIf="form.get('quantity')?.errors?.['min']">يجب أن تكون الكمية أكبر من صفر</mat-error>
                </mat-form-field>
            </div>

            <!-- Price -->
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>السعر</mat-label>
                    <input matInput type="number" formControlName="price" min="0">
                    <mat-error *ngIf="form.get('price')?.errors?.['required']">السعر مطلوب</mat-error>
                    <mat-error *ngIf="form.get('price')?.errors?.['min']">يجب أن يكون السعر 0 أو أكثر</mat-error>
                </mat-form-field>
            </div>

        </form>
    </mat-dialog-content>

    <mat-dialog-actions align="start" class="mt-2">
        <button mat-raised-button color="primary" (click)="onSave()">حفظ</button>
        <button mat-raised-button class="mx-2" (click)="onCancel()">إلغاء</button>
    </mat-dialog-actions>
</div>
