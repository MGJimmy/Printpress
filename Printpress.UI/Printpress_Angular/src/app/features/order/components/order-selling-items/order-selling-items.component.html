<div>
    <div class="mb-2" *ngIf="!isViewMode">
        <button mat-raised-button color="primary" (click)="onAddItem()">
            <mat-icon class="me-1">add</mat-icon>
            إضافة عنصر
        </button>
    </div>

    <ng-container *ngIf="dataSource.length > 0; else noDataTemplate">
        <table mat-table [dataSource]="dataSource" class="custom-table w-100">

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>اسم العنصر</th>
                <td mat-cell *matCellDef="let element">{{ element.inventoryItemName || element.name }}</td>
            </ng-container>

            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef>النوع</th>
                <td mat-cell *matCellDef="let element">
                    <span class="badge" [ngClass]="element.isInventoryItem ? 'badge-primary' : 'badge-secondary'">
                        {{ element.isInventoryItem ? 'من المخزن' : 'خارجي' }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="quantity">
                <th mat-header-cell *matHeaderCellDef>الكمية</th>
                <td mat-cell *matCellDef="let element">{{ element.quantity }}</td>
            </ng-container>

            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef>السعر</th>
                <td mat-cell *matCellDef="let element">{{ element.price | number:'1.2-2' }}</td>
            </ng-container>

            <ng-container matColumnDef="total">
                <th mat-header-cell *matHeaderCellDef>الإجمالي</th>
                <td mat-cell *matCellDef="let element">{{ (element.price * element.quantity) | number:'1.2-2' }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>إجراء</th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="!isViewMode" mat-icon-button color="primary" (click)="onEditItem(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button *ngIf="!isViewMode" mat-icon-button color="warn" (click)="onDeleteItem(element)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </ng-container>

    <ng-template #noDataTemplate>
        <div class="text-center my-4 text-muted">لا توجد عناصر بيع</div>
    </ng-template>
</div>
