<div class="prices-dialog" dir="rtl">
  <header class="hero" [class.zero]="isZeroOrder">
    <div>
      <h4>أسعار خدمات الطلبية</h4>
      <p>إذا أصبحت كل أسعار الخدمات صفراً يُعامل الطلب كطلب صفري تلقائياً.</p>
    </div>
    <span class="zero-badge" *ngIf="isZeroOrder">طلب صفري</span>
  </header>

  <div class="hint">
    التعديل في سعر خدمة يطبَّق على كل المجموعات التي تحتوي هذه الخدمة.
    السعر صفر مسموح في الطلب العادي.
  </div>

  <div class="services-grid mb-3">
    <ng-container *ngFor="let service of _tempServicesList">
      <div *ngIf="!service.isDeleted" class="service-item" [class.new]="isEditMode && service.isNew" [class.zero-price]="service.price === 0">
        <div class="d-flex justify-content-between align-items-center gap-2">
          <span class="service-name">{{service.name}}</span>
          <span class="badge bg-success" *ngIf="service.isNew">جديد</span>
        </div>
        <div class="input-group input-group-sm">
          <input type="number" min="0" class="form-control text-center" [(ngModel)]="service.price" (ngModelChange)="onPriceChange()" placeholder="السعر" />
          <span class="input-group-text">ج.م</span>
        </div>
      </div>
    </ng-container>
  </div>

  <div class="footer-actions">
    <button mat-stroked-button type="button" mat-dialog-close>رجوع</button>
    <button mat-stroked-button color="warn" type="button" (click)="makeZeroOrder()">
      حفظ كطلب صفري
    </button>
    <button mat-flat-button color="primary" type="button" (click)="save_Click()">حفظ</button>
  </div>
</div>
