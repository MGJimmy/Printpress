<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>person</mat-icon>
    </div>
    <div>
      <h1>{{ isEdit ? 'تعديل المستخدم' : 'إضافة مستخدم جديد' }}</h1>
      <p>بيانات الحساب والصلاحيات</p>
    </div>
    <button mat-stroked-button type="button" class="hero-back" (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
      رجوع
    </button>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>edit_note</mat-icon>
      <span>بيانات المستخدم</span>
    </div>
    <form [formGroup]="form">
      <div class="filters">
        <mat-form-field appearance="outline" *ngIf="!isEdit">
          <mat-label>اسم المستخدم</mat-label>
          <input matInput formControlName="userName" />
          <mat-error>اسم المستخدم مطلوب</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>البريد الإلكتروني</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error>البريد الإلكتروني غير صحيح</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>الاسم الأول</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>الاسم الأخير</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>رقم الهاتف</mat-label>
          <input matInput formControlName="phoneNumber" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>الصلاحيات</mat-label>
          <mat-select formControlName="roles" multiple>
            <mat-option *ngFor="let role of availableRoles" [value]="role">{{ role }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" *ngIf="!isEdit">
          <mat-label>كلمة المرور</mat-label>
          <input matInput formControlName="password" type="password" />
          <mat-error>كلمة المرور مطلوبة</mat-error>
        </mat-form-field>
      </div>
      <div class="actions">
        <button mat-raised-button color="primary" type="button" (click)="onSave()" [disabled]="isSaving">
          <mat-icon>save</mat-icon>
          {{ isSaving ? 'جاري الحفظ...' : 'حفظ' }}
        </button>
        <button mat-stroked-button type="button" (click)="onBack()">إلغاء</button>
      </div>
    </form>
  </mat-card>
</div>
