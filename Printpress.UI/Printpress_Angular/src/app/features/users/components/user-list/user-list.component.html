<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>group</mat-icon>
    </div>
    <div>
      <h1>إدارة المستخدمين</h1>
      <p>الحسابات والصلاحيات</p>
    </div>
    <div class="hero-actions">
      <button mat-flat-button type="button" (click)="onAdd()">
        <mat-icon>person_add</mat-icon>
        إضافة مستخدم
      </button>
    </div>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>table_chart</mat-icon>
      <span>المستخدمون</span>
      <span class="count">{{ rows.length }}</span>
    </div>
    <div class="table-wrap" *ngIf="rows.length > 0; else noData">
      <table mat-table [dataSource]="rows" class="w-100">
        <ng-container matColumnDef="seq">
          <th mat-header-cell *matHeaderCellDef>م</th>
          <td mat-cell *matCellDef="let row; let i = index">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="userName">
          <th mat-header-cell *matHeaderCellDef>اسم المستخدم</th>
          <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>البريد الإلكتروني</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>الاسم</th>
          <td mat-cell *matCellDef="let row">{{ row.fullName }}</td>
        </ng-container>
        <ng-container matColumnDef="phoneNumber">
          <th mat-header-cell *matHeaderCellDef>رقم الهاتف</th>
          <td mat-cell *matCellDef="let row">{{ row.phoneNumber }}</td>
        </ng-container>
        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>الصلاحيات</th>
          <td mat-cell *matCellDef="let row">{{ row.roles }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>إجراء</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="onEdit(row.id)">
                <mat-icon>edit</mat-icon>
                <span>تعديل</span>
              </button>
              <button mat-menu-item (click)="onChangePassword(row.id)">
                <mat-icon>lock_reset</mat-icon>
                <span>تغيير كلمة المرور</span>
              </button>
              <button mat-menu-item (click)="onDelete(row.id)">
                <mat-icon>delete</mat-icon>
                <span>حذف</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="['seq','userName','email','fullName','phoneNumber','roles','actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['seq','userName','email','fullName','phoneNumber','roles','actions'];"></tr>
      </table>
    </div>
    <ng-template #noData>
      <p class="empty">لا يوجد مستخدمون</p>
    </ng-template>
  </mat-card>
</div>
