<div class="page-shell" dir="rtl">
  <header class="hero">
    <div class="hero-icon">
      <mat-icon>lock_reset</mat-icon>
    </div>
    <div>
      <h1>تغيير كلمة المرور</h1>
      <p>كلمة مرور جديدة للحساب</p>
    </div>
    <button mat-stroked-button type="button" class="hero-back" (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
      رجوع
    </button>
  </header>

  <mat-card class="panel">
    <div class="panel-title">
      <mat-icon>password</mat-icon>
      <span>كلمة المرور</span>
    </div>
    <form [formGroup]="form">
      <div class="filters">
        <mat-form-field appearance="outline">
          <mat-label>كلمة المرور الجديدة</mat-label>
          <input matInput formControlName="newPassword" type="password" />
          <mat-error *ngIf="form.controls.newPassword.hasError('required')">كلمة المرور مطلوبة</mat-error>
          <mat-error *ngIf="form.controls.newPassword.hasError('minlength')">يجب أن تكون 7 أحرف على الأقل</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>تأكيد كلمة المرور</mat-label>
          <input matInput formControlName="confirmPassword" type="password" />
          <mat-error *ngIf="form.controls.confirmPassword.hasError('required')">تأكيد كلمة المرور مطلوب</mat-error>
        </mat-form-field>
      </div>
      <p class="empty" *ngIf="form.hasError('mismatch') && form.controls.confirmPassword.touched" style="color:#c62828">
        كلمتا المرور غير متطابقتين
      </p>
      <div class="actions">
        <button mat-raised-button color="primary" type="button" (click)="onSave()" [disabled]="isSaving">
          <mat-icon>lock_reset</mat-icon>
          {{ isSaving ? 'جاري الحفظ...' : 'تغيير كلمة المرور' }}
        </button>
        <button mat-stroked-button type="button" (click)="onBack()">إلغاء</button>
      </div>
    </form>
  </mat-card>
</div>
