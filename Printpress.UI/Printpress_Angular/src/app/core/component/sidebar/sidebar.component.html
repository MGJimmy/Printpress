<div id="sidebar-wrapper" [class.toggled]="toggled" [attr.aria-expanded]="toggled">
  <div class="sidebar-heading">القائمة</div>
  <div class="list-group list-group-flush">
    <a
      *appHasRole="userRoleEnum.admin"
      routerLink="/clients"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="list-group-item list-group-item-action"
    >
      <fa-icon [icon]="faUserGroup" class="fa-icon mx-2"></fa-icon>
      <span>قائمة العملاء</span>
    </a>

    <a
      routerLink="/orderlist"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="list-group-item list-group-item-action"
    >
      <fa-icon [icon]="faCartArrowDown" class="fa-icon mx-2"></fa-icon>
      <span>قائمة الطلبات</span>
    </a>

    <a
      *appHasRole="userRoleEnum.admin"
      routerLink="/services"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="list-group-item list-group-item-action"
    >
      <fa-icon [icon]="faCog" class="fa-icon mx-2"></fa-icon>
      <span>إعدادات الخدمات</span>
    </a>

    <a
      *appHasRole="userRoleEnum.admin"
      routerLink="/inventory/items"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="list-group-item list-group-item-action"
    >
      <fa-icon [icon]="faBars" class="fa-icon mx-2"></fa-icon>
      <span>عناصر المخزون</span>
    </a>

    <a
      *appHasRole="userRoleEnum.admin"
      routerLink="/spare-parts/items"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="list-group-item list-group-item-action"
    >
      <fa-icon [icon]="faWrench" class="fa-icon mx-2"></fa-icon>
      <span>قطع الغيار</span>
    </a>

    <!-- HR -->
    <div class="list-group-item reports-parent" (click)="toggleHR()" style="cursor:pointer;">
      <fa-icon [icon]="faUserTie" class="fa-icon mx-2"></fa-icon>
      <span>الموارد البشرية</span>
    </div>
    <div *ngIf="isHRExpanded" class="reports-children">
      <a
        routerLink="/hr/payroll-periods"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: false }"
        class="list-group-item list-group-item-action ps-5"
      >
        <span>دورات الرواتب</span>
      </a>
    </div>

    <!-- Reports -->
    <div class="list-group-item reports-parent" (click)="toggleReports()" style="cursor:pointer;">
      <fa-icon [icon]="faChartBar" class="fa-icon mx-2"></fa-icon>
      <span>التقارير</span>
    </div>
    <div *ngIf="isReportsExpanded" class="reports-children">
      <a
        routerLink="/reports/order-inventory-items"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="list-group-item list-group-item-action ps-5"
      >
        <span>تقارير عناصر المخزن في الطلبات</span>
      </a>
      <a
        routerLink="/reports/inventory-services-usage"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="list-group-item list-group-item-action ps-5"
      >
        <span>تقرير عناصر المخزن والخدمات المستخدمة</span>
      </a>
    </div>
  </div>

  <div class="logout-section list-group-item list-group-item-action"
  >
    <button (click)="confirmLogout()" class="logout-btn">
      <fa-icon class="mx-2" [icon]="faSignOutAlt"></fa-icon>
      <span>تسجيل الخروج</span>
    </button>
  </div>

  <button (click)="toggleSidebar()" class="toggle-btn" aria-label="Toggle Sidebar">
    <fa-icon [icon]="toggled ? faBars : faTimes"></fa-icon>
  </button>
</div>
