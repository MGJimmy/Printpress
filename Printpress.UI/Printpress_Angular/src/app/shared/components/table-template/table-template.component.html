<div class="table-container">
  <table
    mat-table [dataSource]="originalSource"
    class="gradient-table custom-table w-100"
    aria-label="Periodic Table of Elements"
    [ngClass]="{'restyled': reportTable, 'hidden':!isShowHeader}"
    >

    <!-- dynamic loopbable number of columns -->
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
      <th
        mat-header-cell
        *matHeaderCellDef
      >
      {{ getColumnHeaderName(column) }}
      </th>
      <td mat-cell *matCellDef="let element">
        <span *ngIf="column === sequenceColumn">{{ originalSource.indexOf(element) + 1 }}</span>
        <span *ngIf="column != actionColumn && column !== sequenceColumn">
            <ng-container *ngTemplateOutlet="dataTemplate; context:{element, column}"></ng-container>
        </span>
        <span *ngIf="column === actionColumn">
          <ng-container *ngTemplateOutlet="actionTemplate; context:{element}"></ng-container>
        </span>
      </td>
    </ng-container>

    <!-- Table rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;"
      [attr.data-id]="row.id"
      [ngClass]="{ 'highlight': row.isHighlighted }">
    </tr>
  </table>



  <!-- Shared Pagination Component conditionally rendered -->
  <app-shared-pagination *ngIf = "conditionalPagination"
    [totalItems]="totalItemsCount"
    (onPageChange)="onPageChangeClick($event)">
  </app-shared-pagination>
</div>


<ng-template #actionTemplate let-element = "element">
   <button *ngIf="showViewButton"
    class="mx-3" mat-raised-button color="primary" (click)="onView(element)"><fa-icon [icon]="faView"></fa-icon> عرض</button>
  <button *ngIf="isShowEditButton"
    class="mx-3" mat-raised-button color="primary" (click)="onEdit(element)"><fa-icon [icon]="faEdit"></fa-icon> تعديل</button>
  <button *ngIf="isShowDeleteButton"
    class="mx-3" mat-raised-button color="warn" (click)="onDelete(element)"> <fa-icon [icon]="faTrash"></fa-icon> حذف</button>
  <button *ngIf="showVoidButton && element.canVoid"
    class="mx-3" mat-raised-button color="warn" (click)="onVoid(element)">إلغاء</button>
  <button *ngIf="showDeactivateButton"
    class="mx-3" mat-raised-button color="accent" (click)="onDeactivate(element)"><fa-icon [icon]="faBan"></fa-icon> تعطيل</button>
    <button *ngIf="showDeactivateButton"
    class="mx-3" mat-raised-button color="accent" (click)="onActivate(element)"><fa-icon [icon]="faCheckCircle"></fa-icon> تنشيط</button>
</ng-template>

<ng-template #dataTemplate let-element = "element" let-column = "column">
  <ng-container *ngIf="column === 'amount'">
    {{element[column] | number:'1.2-2'}} جنيه
  </ng-container>
  <ng-container *ngIf="column !== 'amount' && column !== linkColumnName">
    <ng-container *ngIf="getTranslationPrefix(column); else normalValue">
      {{
        getTranslationPrefix(column) + '.' + element[column] | translate
      }}
    </ng-container>

    <ng-template #normalValue>
      {{ element[column] }}
    </ng-template>
  </ng-container>
  <ng-container *ngIf="column === linkColumnName && element[column]">
    <a style="cursor:pointer; color: var(--primary-color, #1976d2); text-decoration: underline;" (click)="onLinkColumnClick(element)">{{element[column]}}</a>
  </ng-container>
  <ng-container *ngIf="column === linkColumnName && !element[column]">
    —
  </ng-container>
</ng-template>
